<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EveryCourtAI</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
}

.container{
    max-width:900px;
    margin:40px auto;
    text-align:center;
}

.logo{
    width:220px;
    margin-bottom:20px;
}

h1{
    margin:0;
    font-size:48px;
}

.subtitle{
    color:#666;
    margin-top:10px;
    margin-bottom:35px;
    font-size:22px;
}

textarea{

    width:100%;
    height:180px;

    border:1px solid #ddd;
    border-radius:12px;

    font-size:20px;

    padding:20px;

    box-sizing:border-box;

    resize:none;

}

button{

    margin-top:30px;

    background:#1769ff;

    color:white;

    border:none;

    border-radius:10px;

    padding:18px 45px;

    font-size:22px;

    cursor:pointer;

}

button:hover{

    background:#0d5ae5;

}

.result{

    margin-top:50px;

    background:white;

    border-radius:12px;

    padding:30px;

    min-height:180px;

    text-align:left;

    font-size:20px;

    line-height:1.8;

    box-shadow:0 0 10px rgba(0,0,0,.08);

}

.example{

    margin-top:30px;

    text-align:left;

    color:#666;

    line-height:2;

}

</style>

</head>

<body>

<div class="container">

<img class="logo"
src="assets/logo/ET-LOGO.png"
alt="EveryCourtAI">

<h1>EveryCourtAI</h1>

<div class="subtitle">

AI-powered Tennis Equipment Intelligence

</div>

<textarea
id="question"
placeholder="Describe your racket, playing style and what you want to improve..."></textarea>

<br>

<button onclick="askAI()">

Analyze My Setup

</button>

<div class="example">

<b>Example Questions</b>

<ul>

<li>Recommend a racket for an intermediate player.</li>

<li>Compare Wilson Blade 98 vs Head Speed MP.</li>

<li>Best string for RF 01 Pro?</li>

<li>My elbow hurts. Suggest a comfortable setup.</li>

</ul>

</div>

<div id="answer" class="result">

AI Recommendation will appear here...

</div>

</div>

<script>

async function askAI(){

const question=document.getElementById("question").value;

document.getElementById("answer").innerHTML="Thinking...";

try{

const response=await fetch("你的Make Webhook地址",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

question:question

})

});

const data=await response.json();

document.getElementById("answer").innerHTML=data.output;

}

catch(e){

document.getElementById("answer").innerHTML="Connection Failed.";

}

}

</script>

</body>

</html>
