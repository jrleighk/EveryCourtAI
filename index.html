<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EveryCourtAI</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f8fa;
}

.container{
    width:90%;
    max-width:850px;
    margin:50px auto;
    text-align:center;
}

.logo{
    width:220px;
    margin-bottom:20px;
}

h1{
    font-size:42px;
    margin:10px 0;
}

.subtitle{
    font-size:18px;
    color:#666;
    margin-bottom:40px;
}

textarea{

    width:100%;
    height:180px;

    border:1px solid #ddd;
    border-radius:12px;

    padding:18px;

    font-size:17px;

    resize:none;

    box-sizing:border-box;

}

button{

    margin-top:25px;

    background:#0d6efd;

    color:white;

    border:none;

    border-radius:10px;

    padding:16px 45px;

    font-size:18px;

    cursor:pointer;

}

button:hover{

    background:#084298;

}

.answer{

    margin-top:45px;

    text-align:left;

    background:white;

    border-radius:12px;

    padding:25px;

    border:1px solid #ddd;

    min-height:180px;

    white-space:pre-wrap;

}

.examples{

    margin-top:30px;

    color:#777;

    font-size:15px;

    text-align:left;

}

.examples p{

    margin:8px 0;

}

</style>

</head>

<body>

<div class="container">

<img src="assets/logo/logo.png" class="logo">

<h1>EveryCourtAI</h1>

<div class="subtitle">

AI-powered Tennis Equipment Intelligence

</div>

<textarea
id="question"
placeholder="Describe your racket, playing style and what you want to improve..."></textarea>

<br>

<button onclick="askAI()">

Analyze My Setup

</button>

<div class="examples">

<b>Example Questions</b>

<p>• Recommend a racket for an intermediate player.</p>

<p>• Compare Wilson Blade 98 vs Head Speed MP.</p>

<p>• Best string for RF 01 Pro?</p>

<p>• My elbow hurts. Suggest a comfortable setup.</p>

</div>

<div id="answer" class="answer">

AI Recommendation will appear here...

</div>

</div>

<script>

async function askAI(){

const question=document.getElementById("question").value;

if(question==""){

alert("Please enter a question.");

return;

}

document.getElementById("answer").innerHTML="Thinking...";



/*

下一步这里接 Make Webhook

*/

document.getElementById("answer").innerHTML=

"You asked:\n\n"+question+

"\n\n(Next step: connect Make.com webhook.)";

}

</script>

</body>

</html>
